<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 370" width="780" height="370"
     font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5">
  <!--
    Animation uses SMIL <animate> elements and inline fill attributes only:
    no <style> block, so it still renders (statically) even if a sanitizer
    strips CSS, and animates in any <img>-rendered context. Loops every 14s.
  -->
  <rect width="780" height="370" rx="8" fill="#0d1117" stroke="#30363d"/>
  <circle cx="22" cy="20" r="5" fill="#ff5f56"/>
  <circle cx="40" cy="20" r="5" fill="#ffbd2e"/>
  <circle cx="58" cy="20" r="5" fill="#27c93f"/>
  <text x="700" y="24" fill="#484f58" font-size="11">hookdrift</text>

  <text x="20" y="58" fill="#e6edf3" opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.0214;0.0393;0.93;1" dur="14s" repeatCount="indefinite"/>
    <tspan fill="#7ee787">$</tspan><tspan dx="8">npx hookdrift infer ./fixtures</tspan>
  </text>
  <text x="20" y="78" fill="#e6edf3" opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.0857;0.1036;0.93;1" dur="14s" repeatCount="indefinite"/>
    stripe/charge.succeeded: created (36 samples, 53 paths)
  </text>
  <text x="20" y="96" fill="#e6edf3" opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.1071;0.125;0.93;1" dur="14s" repeatCount="indefinite"/>
    github/push: created (5 samples, 32 paths)
  </text>
  <text x="20" y="114" fill="#8b949e" opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.1286;0.1464;0.93;1" dur="14s" repeatCount="indefinite"/>
    2 contract(s) in .hookdrift/ — commit them to git.
  </text>

  <text x="20" y="146" fill="#e6edf3" opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.2286;0.2464;0.93;1" dur="14s" repeatCount="indefinite"/>
    <tspan fill="#7ee787">$</tspan><tspan dx="8">npx hookdrift check ./fixtures</tspan><tspan fill="#8b949e" dx="16"># weeks later: fresh payloads</tspan>
  </text>
  <text x="20" y="168" fill="#e6edf3" opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.3;0.3179;0.93;1" dur="14s" repeatCount="indefinite"/>
    stripe/charge.succeeded
  </text>

  <text x="34" y="188" opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.3286;0.3464;0.93;1" dur="14s" repeatCount="indefinite"/>
    <tspan fill="#ff7b72">BREAKING</tspan><tspan fill="#e6edf3" dx="10">data.object.amount_refunded</tspan><tspan fill="#8b949e" dx="10">moved to data.object.totals.amount_refunded</tspan>
  </text>
  <text x="34" y="206" opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.3571;0.375;0.93;1" dur="14s" repeatCount="indefinite"/>
    <tspan fill="#ff7b72">BREAKING</tspan><tspan fill="#e6edf3" dx="10">data.object.paid</tspan><tspan fill="#8b949e" dx="10">null observed (never null in 36 contract samples)</tspan>
  </text>
  <text x="34" y="224" opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.3857;0.4036;0.93;1" dur="14s" repeatCount="indefinite"/>
    <tspan fill="#e3b341">WARNING</tspan><tspan fill="#e6edf3" dx="17">data.object.currency</tspan><tspan fill="#8b949e" dx="10">new enum value [chf] — switches will miss it</tspan>
  </text>
  <text x="34" y="242" opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.4143;0.4321;0.93;1" dur="14s" repeatCount="indefinite"/>
    <tspan fill="#e3b341">WARNING</tspan><tspan fill="#e6edf3" dx="17">pending_webhooks</tspan><tspan fill="#8b949e" dx="10">required → optional (36/36 → 8/10 samples)</tspan>
  </text>
  <text x="34" y="260" opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.4429;0.4607;0.93;1" dur="14s" repeatCount="indefinite"/>
    <tspan fill="#79c0ff">INFO</tspan><tspan fill="#e6edf3" dx="42">data.object.balance_transaction</tspan><tspan fill="#8b949e" dx="10">both shapes coexist — expandable</tspan>
  </text>
  <text x="34" y="278" opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.4714;0.4893;0.93;1" dur="14s" repeatCount="indefinite"/>
    <tspan fill="#79c0ff">INFO</tspan><tspan fill="#e6edf3" dx="42">data.object.totals</tspan><tspan fill="#8b949e" dx="10">new field appeared in 10/10 new samples</tspan>
  </text>

  <text x="20" y="306" fill="#e6edf3" opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.5143;0.5321;0.93;1" dur="14s" repeatCount="indefinite"/>
    2 breaking, 5 warning(s), 2 info <tspan fill="#8b949e">(1 suppressed) across 2 contract(s)</tspan>
  </text>
  <text x="20" y="334" fill="#8b949e" opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.5571;0.575;0.93;1" dur="14s" repeatCount="indefinite"/>
    exit 1 — CI fails here, instead of a customer finding out next week
  </text>

  <rect x="20" y="346" width="8" height="14" fill="#7ee787" opacity="0.9">
    <animate attributeName="opacity" values="0.9;0.9;0;0;0.9" keyTimes="0;0.49;0.5;0.99;1" dur="1.1s" repeatCount="indefinite"/>
  </rect>
</svg>
